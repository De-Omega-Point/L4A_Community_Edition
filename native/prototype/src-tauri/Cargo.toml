[package]
name = "l4a-community-prototype"
version = "0.1.0"
description = "Loyalty4All Community Edition — test-only hosted-gate prototype"
authors = ["De-Omega-Point"]
edition = "2021"
default-run = "l4a-community-prototype"

[lib]
name = "l4a_community_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

serde_json = "=1.0.154"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

[features]
export-smoke = []

[[bin]]
name = "l4a-community-prototype"
path = "src/main.rs"

[[bin]]
name = "l4a-export-smoke"
path = "src/bin/export_smoke.rs"
required-features = ["export-smoke"]
