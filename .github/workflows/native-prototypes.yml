name: Native prototypes - UNSIGNED TEST ONLY
on:
  pull_request:
    paths: ['native/prototype/**', '.github/workflows/native-prototypes.yml']
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Focus a diagnostic rerun on Windows (not a full-platform pass)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-prototype-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"runner":"windows-2022","target":"x86_64-pc-windows-msvc","bundle":"msi"}]' || '[{"runner":"macos-14","target":"aarch64-apple-darwin","bundle":"dmg"},{"runner":"windows-2022","target":"x86_64-pc-windows-msvc","bundle":"msi"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/prototype
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Existing free toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Generate icons from existing Community image
        run: npm run tauri -- icon ../../public/community/assets/icon-512.png
      - name: Test navigation boundary
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build unsigned native test package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci
      - name: Collect exact bytes and checksums
        run: node scripts/collect-artifacts.mjs ${{ matrix.target }}
      - name: Inspect Mac package and respect Gatekeeper
        if: runner.os == 'macOS'
        run: node scripts/smoke-macos.mjs
      - name: Install and startup smoke on disposable Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Build separate synthetic Windows export harness (never bundled)
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml --features export-smoke --bin l4a-export-smoke
      - name: Exercise native Save As and verified export outcomes
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows-export.ps1
      - name: Validate restore of actual synthetic saved backup
        if: runner.os == 'Windows'
        run: node scripts/verify-export-restore.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UNSIGNED-TEST-ONLY-${{ matrix.target }}
          path: native/prototype/evidence/
          retention-days: 7
          if-no-files-found: error
  android:
    if: github.event.repository.private == false && !inputs.windows_only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/prototype
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Prepare standard runner Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - run: npm run tauri -- icon ../../public/community/assets/icon-512.png
      - name: Assert no preexisting debug key
        run: test ! -f "$HOME/.android/debug.keystore"
      - name: Generate Android project, no Gradle or debug build
        run: |
          test ! -f "$HOME/.android/debug.keystore"
          npm run tauri -- android init --ci --skip-targets-install
          test ! -f "$HOME/.android/debug.keystore"
      - name: Prohibit every signing and key-generation task
        run: node scripts/prepare-android.mjs
      - name: Build UNSIGNED release APK only
        run: npm run tauri -- android build --ci --apk --target aarch64
      - name: Check no key generated and APK is unsigned
        run: |
          node scripts/prepare-android.mjs --check
          test ! -f "$HOME/.android/debug.keystore"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned.apk' -print -quit)
          test -n "$apk"
          if "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"; then
            echo 'Unexpected signed APK; refusing artifact upload'; exit 1
          fi
          node scripts/collect-artifacts.mjs android-aarch64
          python scripts/inspect-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-NOT-INSTALLABLE-android-aarch64
          path: native/prototype/evidence/
          retention-days: 7
          if-no-files-found: error
